[package]
name = "oracle_manipulation"
version = "0.1.0"
description = "Mango-style oracle price manipulation vulnerability demo"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "oracle_manipulation"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
